site_name: Agent-Bench
site_description: Enterprise Agent Reliability & Safety Benchmark Framework
site_author: Vinicius Caridá
site_url: https://vfcarida.github.io/Agent-Bench/
repo_url: https://github.com/vfcarida/Agent-Bench
repo_name: vfcarida/Agent-Bench

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Architecture Overview: getting-started/architecture-overview.md
  - User Guides:
      - Connecting External Agents: guides/adding-agent.md
      - Adding Evaluation Domains: guides/adding-domain.md
      - Running Local Models: guides/running-local-models.md
      - Inspect AI Interoperability: guides/inspect-ai-interoperability.md
  - Methodology:
      - Hard Safety Gating: methodology/safety-gating.md
      - Statistical Reliability Metrics: methodology/statistical-metrics.md
      - Rubric & Tool Grading: methodology/rubric-and-tool-grading.md
      - Inter-Annotator Agreement: methodology/inter-annotator.md
  - Reference:
      - CLI Reference: reference/cli.md
      - Python API Reference: reference/api.md
