# Pre-commit configuration for Agent-Bench
# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.5
          - pydantic-settings>=2.0
          - pyyaml>=6.0
          - click>=8.1
          - rich>=13.0
          - structlog>=23.2
          - pytest>=7.4
        args: [--config-file=pyproject.toml]
        files: ^src/

  - repo: local
    hooks:
      - id: check-gold-integrity
        name: Check Gold Dataset Integrity
        entry: python scripts/check_gold_integrity.py
        language: system
        pass_filenames: false
        files: ^datasets/gold/

