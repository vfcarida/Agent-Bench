name: Benchmark CI & Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  bench-ci:
    name: Lint, Test & Golden Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Code Quality - Ruff Linting
        run: |
          ruff check src/ agent_bench tests/

      - name: Type Checking - Mypy
        run: |
          mypy src/agent_bench

      - name: Run Unit & Integration Tests
        run: |
          pytest tests/ -v --cov=src/agent_bench --cov-report=term-missing

      - name: Validate Benchmark Configs
        run: |
          bench --config-dir configs validate-config

      - name: Run Golden Benchmarks Suite
        run: |
          bench --config-dir configs run-suite pix_basic_v1
