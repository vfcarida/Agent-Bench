[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-bench"
version = "1.0.0"
description = "Enterprise Agent Evaluation Benchmark: Multi-Domain Reliability, Non-Compensable Safety Gating & Real Telemetry"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Agent-Bench Maintainers", email = "maintainers@agentbench.dev" },
]
readme = "README.md"
keywords = ["agent", "benchmark", "llm-evaluation", "safety-gate", "fintech", "pix", "reasoning-models", "tool-use", "rag"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyarrow>=14.0",
    "httpx>=0.25",
    "structlog>=23.2",
]

[project.urls]
Homepage = "https://github.com/agent-bench/agent-bench"
Repository = "https://github.com/agent-bench/agent-bench"
Documentation = "https://github.com/agent-bench/agent-bench/tree/main/docs"
"Bug Tracker" = "https://github.com/agent-bench/agent-bench/issues"
Changelog = "https://github.com/agent-bench/agent-bench/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]
openai = ["openai>=1.6"]
anthropic = ["anthropic>=0.18"]
huggingface = ["transformers>=4.38", "torch>=2.1", "accelerate>=0.27"]
peft = ["peft>=0.9", "transformers>=4.38", "torch>=2.1"]
vllm = ["vllm>=0.4", "torch>=2.1"]
gpu = ["vllm>=0.4", "torch>=2.1"]
athena = ["transformers>=4.38", "torch>=2.1", "peft>=0.9", "accelerate>=0.27"]
all = ["agent-bench[openai,anthropic,huggingface,peft]"]
all-gpu = ["agent-bench[all,vllm]"]

[project.scripts]
bench = "agent_bench.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "vllm",
    "vllm.*",
]
ignore_missing_imports = true
